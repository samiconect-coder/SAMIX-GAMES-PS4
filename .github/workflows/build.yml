name: SAMIX GAMES PS4 Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang lld unzip

      - name: Download OpenOrbis Toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/OpenOrbisSDK"

          curl -fL \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o toolchain.tar.gz

          tar -xzf toolchain.tar.gz \
            -C "$RUNNER_TEMP/OpenOrbisSDK"

          FSELF=$(find "$RUNNER_TEMP/OpenOrbisSDK" \
            -type f -path '*/bin/linux/create-fself' -print -quit)

          if [ -z "$FSELF" ]; then
            echo "ERROR: create-fself was not found"
            exit 1
          fi

          SDK_ROOT=$(dirname "$(dirname "$(dirname "$FSELF")")")
          echo "OO_PS4_TOOLCHAIN=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Download PkgTool
        run: |
          curl -fL \
            https://github.com/maxton/LibOrbisPkg/releases/download/v0.2/PkgTool.Core-linux-x64-0.2.231.zip \
            -o pkgtool.zip

          unzip -o pkgtool.zip -d pkgtool
          chmod +x pkgtool/PkgTool.Core

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build create-gp4
        run: |
          git clone https://github.com/OpenOrbis/create-gp4.git "$RUNNER_TEMP/create-gp4"

          cd "$RUNNER_TEMP/create-gp4/cmd/create-gp4"

          go build -o create-gp4

          sudo install -m 755 create-gp4 /usr/local/bin/create-gp4

      - name: Generate param.sfo
        run: |
          mkdir -p sce_sys
          rm -f sce_sys/param.sfo

          ./pkgtool/PkgTool.Core sfo_new sce_sys/param.sfo

          ./pkgtool/PkgTool.Core sfo_setentry \
            --value "SAMIX_DZPS4" --type string --maxsize 128 \
            sce_sys/param.sfo TITLE

          ./pkgtool/PkgTool.Core sfo_setentry \
            --value "SAMI00027" --type string --maxsize 16 \
            sce_sys/param.sfo TITLE_ID

          ./pkgtool/PkgTool.Core sfo_setentry \
            --value "00.27" --type string --maxsize 16 \
            sce_sys/param.sfo APP_VER

          ./pkgtool/PkgTool.Core sfo_setentry \
            --value "IV0000-SAMI00027_00-SAMIXDZPS4000000" \
            --type string --maxsize 48 \
            sce_sys/param.sfo CONTENT_ID

          ./pkgtool/PkgTool.Core sfo_listentries sce_sys/param.sfo

          test -s sce_sys/param.sfo

      - name: Build SAMIX GAMES
        run: make

      - name: Generate SAMIX GP4
        run: |
          test -s eboot.bin
          test -s sce_sys/param.sfo
          test -s sce_sys/icon0.png

          create-gp4 \
            -out SAMIX_DZPS4.gp4 \
            --content-id=IV0000-SAMI00027_00-SAMIXDZPS4000000 \
            --files "eboot.bin sce_sys/param.sfo sce_sys/icon0.png"

          test -s SAMIX_DZPS4.gp4

      - name: Build SAMIX PKG
        run: |
          mkdir -p pkg_output

          ./pkgtool/PkgTool.Core pkg_build \
            SAMIX_DZPS4.gp4 pkg_output

          PKG_FILE="pkg_output/IV0000-SAMI00027_00-SAMIXDZPS4000000.pkg"

          if [ ! -s "$PKG_FILE" ]; then
            echo "ERROR: PKG output was not created"
            find pkg_output -maxdepth 2 -type f
            exit 1
          fi

          cp "$PKG_FILE" SAMIX_DZPS4.pkg

          test -s SAMIX_DZPS4.pkg

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: SAMIX-DZPS4-BUILD
          path: |
            eboot.bin
            sce_sys/param.sfo
            sce_sys/icon0.png
            SAMIX_DZPS4.gp4
            SAMIX_DZPS4.pkg